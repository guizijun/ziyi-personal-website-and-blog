<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark" data-accent="violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章发布站 · Yao Space</title>
<meta name="description" content="Markdown 文章编辑、预览与发布">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../blog/css/blog.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23f59e0b'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'>✎</text></svg>">
</head>
<body>
<div class="blog-bg"></div>

<div class="shell">
  <nav class="nav-bar">
    <a class="logo" href="index.html">
      <div class="logo-mark">✎</div>
      <div>发布站</div>
    </a>
    <div class="nav-links">
      <a href="../index.html">个人主页</a>
      <a href="../blog/">博客前台</a>
    </div>
  </nav>

  <header class="hero" style="padding:18px 4px 26px">
    <h1 style="font-size:clamp(26px,4vw,38px)">写文章</h1>
    <p style="font-size:15px">Markdown 编辑 · 实时预览 · 一键导出。数据保存在浏览器本地。</p>
  </header>

  <div class="admin-layout">
    <!-- 侧栏：文章列表 -->
    <aside class="side-card">
      <div class="row-between" style="margin-bottom:12px">
        <div class="side-title" style="margin:0">文章</div>
        <button class="btn btn-sm btn-primary" id="btn-new">＋ 新建</button>
      </div>
      <div id="post-list"></div>

      <div class="hint-box">
        <b>部署提示</b><br>
        导出的 <code>posts.json</code> 放入 <code>blog/posts/</code> 目录即可上线。
        配置 <code>config.js</code> 中的 <code>apiBase</code> 后可直接发布到后端。
      </div>
    </aside>

    <!-- 主区：编辑器 -->
    <section class="editor-card">
      <div class="row-between" style="margin-bottom:18px">
        <div class="row">
          <h2 style="font-size:19px;font-weight:750;letter-spacing:-.015em">编辑器</h2>
          <span id="editor-status"><span class="status-chip draft">草稿</span></span>
        </div>
        <div class="row">
          <button class="btn btn-sm" id="btn-preview">预览</button>
          <button class="btn btn-sm btn-primary" id="btn-publish">发布</button>
        </div>
      </div>

      <div class="editor-grid">
        <div>
          <label class="lbl">标题</label>
          <input class="field" id="f-title" placeholder="文章标题">
        </div>
        <div>
          <label class="lbl">链接标识 (slug)</label>
          <input class="field" id="f-slug" placeholder="my-post">
        </div>
        <div>
          <label class="lbl">日期</label>
          <input class="field" id="f-date" type="date">
        </div>
        <div>
          <label class="lbl">标签（逗号分隔）</label>
          <input class="field" id="f-tags" placeholder="前端, 教程">
        </div>
        <div>
          <label class="lbl">封面色</label>
          <input class="field" id="f-cover" type="color" value="#7c6cff" style="height:44px;padding:4px">
        </div>
        <div>
          <label class="lbl">摘要</label>
          <input class="field" id="f-excerpt" placeholder="一两句话介绍这篇文章">
        </div>
        <div class="full">
          <label class="lbl">正文 (Markdown)</label>
          <textarea class="md-input" id="f-content" placeholder="## 开始写作&#10;&#10;支持标题、列表、代码块、引用、表格、粗斜体、链接、图片……"></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btn-save">保存草稿</button>
        <button class="btn" id="btn-export-json">导出 posts.json</button>
        <button class="btn" id="btn-export-md">导出 .md</button>
        <button class="btn btn-danger" id="btn-del">删除</button>
      </div>

      <div class="preview-pane" id="preview-pane"></div>
    </section>
  </div>

  <footer class="footer">
    <div>© <span id="year">2026</span> Yao Space · <a href="../blog/">博客前台</a></div>
  </footer>
</div>

<script src="../config.js"></script>
<script src="../blog/js/markdown.js"></script>
<script src="js/admin.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
